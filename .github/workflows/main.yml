# Lab 10 — CI/CD Pipeline: Automated Evaluation Gate
# Runs on every push to main. Builds the agent, runs the Lab 7 evaluation
# pipeline, and fails the build if scores drop below thresholds.

name: Agent Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    name: Run Agent Evaluation
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Seed the database (required for tool tests)
      - name: Seed HRIS database
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python main.py --seed

      # 5. Run the headless evaluation script
      - name: Run evaluation pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LLM_MODEL: gemini-flash-latest
        run: |
          python run_eval.py

      # 6. Upload evaluation results as artifact
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.json
